<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>p5ml prototyping</title>
        <link rel="stylesheet" href="src/p5ml.css" />
    </head>
    <body>
        <p5-canvas width="400" height="400">
            <p5-rect w="100" h="80"></p5-rect>
            <p5-translate x="160" y="160">
                <p5-rect class="alt" w="80" h="80"></p5-rect>
            </p5-translate>
            <p5-translate x="180" y="180">
                <p5-rect w="40" h="40"></p5-rect>
            </p5-translate>
        </p5-canvas>
        <script type="module" src="src/p5ml.js"></script>
    </body>
</html>

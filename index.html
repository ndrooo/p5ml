<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>p5ml prototyping</title>
        <link rel="stylesheet" href="/src/env.css" />
        <style>
            p5-canvas {
                background-color: rgba(0, 0, 0, 0.5);
            }

            p5-circle {
                color: red;
                background: rgba(255, 0, 0, 0.5);

                &.alt {
                    color: green;
                    background-color: rgba(0, 0, 255, 0.5);
                }
            }
        </style>
    </head>
    <body>
        <article class="canvas-container" x-data="{ paused: true }" :id="$id">
            <h2>Particles!</h2>
            <div class="tools">
                <button x-on:click="paused = !paused">
                    <div x-show="paused" data-lucide="play"></div>
                    <div x-show="!paused" data-lucide="pause"></div>
                </button>
                <span>FPS: <span class="framerate">0</span></span>
            </div>
            <p5-canvas
                width="600"
                height="600"
                :paused="paused"
                x-data="{ count: 50 }"
                :id="$id"
            >
                <template x-for="i in count">
                    <div>
                        <p5-translate class="mover">
                            <p5-circle d="40"></p5-circle>
                        </p5-translate>
                        <p5-translate class="mover">
                            <p5-circle class="alt" d="20"></p5-circle>
                        </p5-translate>
                    </div>
                </template>
            </p5-canvas>
        </article>
        <script type="module" src="src/p5ml.ts"></script>
        <script type="module" src="src/env.ts"></script>
        <script type="module">
            const canvas = document.getElementsByTagName("p5-canvas")[0];

            let time = 0;

            let movers = [];
            let mover_offsets = [];

            canvas.setup.push((p) => {
                movers = Array.from(document.getElementsByClassName("mover"));
                mover_offsets = Array.from(movers).map(
                    (_mover) => p.random() * 100,
                );
            });

            canvas.update.push((p) => {
                var movers = document.getElementsByClassName("mover");
                for (let i = 0; i < movers.length; i++) {
                    var xNoise = p.noise(time + mover_offsets[i]) * p.width;
                    var yNoise =
                        p.noise(time + 200 + mover_offsets[i]) * p.height;
                    movers[i].setAttribute("x", xNoise.toPrecision(6));
                    movers[i].setAttribute("y", yNoise.toPrecision(6));
                }
                time += 0.01;
            });
        </script>
    </body>
</html>

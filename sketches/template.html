<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>p5ml sandbox</title>
        <link rel="stylesheet" href="/src/env.css" />
        <style>
            p5-canvas {
                background-color: rgba(0, 0, 0, 0.1);
            }

            p5-ellipse {
                color: red;
                background: rgba(255, 0, 0, 0.1);
            }
            p5-circle {
                color: green;
                background: blue;
            }
        </style>
    </head>
    <body>
        <article class="canvas-container" x-data="{ paused: false }" :id="$id">
            <h2>Make your own!</h2>
            <div class="tools">
                <button x-on:click="paused = !paused">
                    <div x-show="paused" data-lucide="play"></div>
                    <div x-show="!paused" data-lucide="pause"></div>
                </button>
                <span>FPS: <span class="framerate">0</span></span>
            </div>
            <p5-canvas
                width="600"
                height="600"
                angle-mode="degrees"
                :paused="paused"
            >
                <p5-translate x="200" y="200">
                    <spin-thing speed="1" class="noisy">
                        <p5-ellipse w="30" h="200"></p5-ellipse>
                    </spin-thing>
                </p5-translate>
                <p5-translate x="350" y="350">
                    <spin-thing speed="1">
                        <p5-translate x="-150" y="-100">
                            <p5-image src="/static/rc.svg"></p5-image>
                        </p5-translate>
                    </spin-thing>
                </p5-translate>
                <seek-touch>
                    <p5-circle d="20"></p5-circle>
                </seek-touch>
            </p5-canvas>
        </article>
        <script type="module" src="/src/p5ml.ts"></script>
        <script type="module" src="/src/env.ts"></script>
        <script type="module" src="/custom/spin-thing.js"></script>
        <script type="module" src="/custom/seek-touch.js"></script>
        <script type="module">
            const canvas = document.getElementsByTagName("p5-canvas")[0];

            let time = 0;

            canvas.update.push((p) => {
                Array.from(canvas.getElementsByClassName("noisy")).forEach(
                    (element) => {
                        element.speed = (p.noise(time) - 0.5) * 8;
                        time += 0.1;
                    },
                );
            });
        </script>
    </body>
</html>

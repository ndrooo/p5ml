<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>p5ml sandbox</title>
        <link rel="stylesheet" href="/src/env.css" />
        <style>
            p5-canvas {
                background-color: rgba(0, 0, 0, 0.1);
            }

            p5-rect {
                color: red;
                background: rgba(255, 0, 0, 0.1);
            }
            p5-circle {
                color: green;
                background: blue;
            }
            p5-text {
                display: none;
                background: white;
            }
        </style>
    </head>
    <body>
        <article class="canvas-container" x-data="{ paused: false }" :id="$id">
            <h2>Reflection room</h2>
            <div class="tools">
                <button x-on:click="paused = !paused">
                    <div x-show="paused" data-lucide="play"></div>
                    <div x-show="!paused" data-lucide="pause"></div>
                </button>
                <span>FPS: <span class="framerate">0</span></span>
            </div>
            <p5-canvas
                width="600"
                height="600"
                angle-mode="degrees"
                :paused="paused"
            >
                <reflection-room x="100" y="100" i="5" j="5">
                    <p5-translate x="5" y="20">
                        <p5-circle d="10"></p5-circle>
                    </p5-translate>
                    <p5-translate x="30" y="45">
                        <spin-thing speed="0.1">
                            <p5-text>Hello</p5-text>
                        </spin-thing>
                    </p5-translate>
                    <p5-translate x="20" y="5">
                        <p5-circle d="10"></p5-circle>
                    </p5-translate>
                    <p5-translate x="50" y="50">
                        <spin-thing speed="1">
                            <p5-translate x="-5" y="-15">
                                <p5-rect w="10" h="30"></p5-rect>
                            </p5-translate>
                        </spin-thing>
                    </p5-translate>
                </reflection-room>
            </p5-canvas>
        </article>
        <script type="module" src="/src/p5ml.ts"></script>
        <script type="module" src="/src/env.ts"></script>
        <script type="module" src="/custom/reflection-room.js"></script>
        <script type="module" src="/custom/spin-thing.js"></script>
    </body>
</html>

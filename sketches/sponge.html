<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>p5ml sandbox</title>
        <link rel="stylesheet" href="/src/env.css" />
        <style>
            p5-canvas {
                background-color: rgba(0, 0, 0, 0.1);
            }

            p5-rect {
                color: white;
                background: blue;
            }
        </style>
    </head>
    <body>
        <article class="canvas-container" x-data="{ paused: false }" :id="$id">
            <h2>Menger sponge</h2>
            <div class="tools">
                <button x-on:click="paused = !paused">
                    <div x-show="paused" data-lucide="play"></div>
                    <div x-show="!paused" data-lucide="pause"></div>
                </button>
                <span>FPS: <span class="framerate">0</span></span>
            </div>
            <p5-canvas
                width="600"
                height="600"
                angle-mode="degrees"
                :paused="paused"
            >
                <recursive-root iterations="4">
                    <p5-translate x="100" y="100">
                        <p5-rect w="100" h="100"></p5-rect>
                    </p5-translate>
                    <p5-scale x="0.3333" y="0.3333">
                        <p5-translate x="600" y="600">
                            <recursive-slot></recursive-slot>
                        </p5-translate>
                        <p5-translate x="300" y="600">
                            <recursive-slot></recursive-slot>
                        </p5-translate>
                        <p5-translate x="0" y="600">
                            <recursive-slot></recursive-slot>
                        </p5-translate>
                        <p5-translate x="0" y="300">
                            <recursive-slot></recursive-slot>
                        </p5-translate>
                        <p5-translate x="600" y="300">
                            <recursive-slot></recursive-slot>
                        </p5-translate>
                        <p5-translate x="600" y="0">
                            <recursive-slot></recursive-slot>
                        </p5-translate>
                        <p5-translate x="300" y="0">
                            <recursive-slot></recursive-slot>
                        </p5-translate>
                        <p5-translate x="0" y="0">
                            <recursive-slot></recursive-slot>
                        </p5-translate>
                    </p5-scale>
                </recursive-root>
            </p5-canvas>
        </article>
        <script type="module" src="/src/p5ml.ts"></script>
        <script type="module" src="/src/env.ts"></script>
        <script type="module" src="/custom/recursive-root.js"></script>
    </body>
</html>
